name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            pkg-config \
            meson \
            ninja-build \
            libwayland-dev \
            wayland-protocols \
            gobject-introspection \
            libgirepository1.0-dev \
            valac \
            git \
            ca-certificates
          # Ubuntu 24.04 runners do not ship libgtk4-layer-shell-dev.
          git clone --depth 1 --branch v1.0.4 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell \
            --prefix=/usr -Dexamples=false -Ddocs=false -Dtests=false
          meson compile -C /tmp/gtk4-layer-shell/build
          sudo meson install -C /tmp/gtk4-layer-shell/build
          sudo ldconfig

      - name: Build
        run: cargo build --locked --release
