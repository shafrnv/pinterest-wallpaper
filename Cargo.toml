[package]
name = "pinterest-wallpaper"
version = "0.1.0"
edition = "2021"
description = "Interactive Pinterest feed as a Hyprland wallpaper"
license = "MIT"

[[bin]]
name = "pinterest-wallpaper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6"
gdk4 = "0.9"
gdk-pixbuf = "0.20"
gio = "0.20"
glib = "0.20"
gtk4 = { version = "0.9", features = ["v4_14"] }
gtk4-layer-shell = "0.4"
open = "5"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.12"
rand = "0.9"
rusqlite = "0.32"
sha1 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
toml = "0.8"
url = "2"
urlencoding = "2"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
