# Copy to ~/.config/pinterest-wallpaper/config.toml
# (created automatically on first run)

# homefeed | all_boards | { board = { id = "..." } } | { local = { path = "..." } }
feed = "homefeed"
# feed = "all_boards"
# feed = { board = { id = "YOUR_BOARD_ID" } }
# feed = { local = { path = "/path/to/images" } }

# Сколько колонок умещается на ширине самого левого монитора.
# На общем полотне колонок больше, размер карточки тот же.
columns = 5
gap = 8
background = "#111111"

# Одно полотно. x/y — пиксели от левого верхнего угла.
# Имя — коннектор из `hyprctl monitors`.
# Два монитора слева направо:
# [[monitors]]
# name = "HDMI-A-1"
# x = 0
# y = 0
# [[monitors]]
# name = "HDMI-A-2"
# x = 1920
# y = 0
#
# Три в ряд и четвёртый над средним:
# [[monitors]]
# name = "DP-1"
# x = 0
# y = 1080
# [[monitors]]
# name = "DP-2"
# x = 1920
# y = 1080
# [[monitors]]
# name = "DP-3"
# x = 3840
# y = 1080
# [[monitors]]
# name = "DP-4"
# x = 1920
# y = 0

# background = настоящие обои (скролл только по пустому столу)
# bottom     = слой над обоями, под окнами — если колёсико не доходит
layer = "background"

# Зум — модификатор плюс колёсико. zoom_step — во сколько раз меняется масштаб
# за один щелчок (1.1 = на 10%). Стрелки и WASD двигают ленту, только когда
# курсор на обоях, не над окном. move_speed — пиксели в секунду.
# [keys]
# zoom = "ctrl"
# zoom_step = 1.1
# move_speed = 800
# left = ["Left", "a"]
# right = ["Right", "d"]
# up = ["Up", "w"]
# down = ["Down", "s"]

# Нужно только для досок (login-oauth):
# [oauth]
# client_id = "YOUR_APP_ID"
# client_secret = "YOUR_APP_SECRET"
# redirect_uri = "http://127.0.0.1:8765/callback"
